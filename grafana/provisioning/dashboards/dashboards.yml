# Grafana Dashboard Provider Configuration
apiVersion: 1

providers:
  - name: 'Flask App Dashboards'
    orgId: 1
    folder: 'Application Monitoring'
    folderUid: 'app-monitoring'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
