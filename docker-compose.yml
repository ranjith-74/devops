services:
  # ---------------------------------------------------------------------------
  # 1. Python Flask Application (Instrumented with prometheus_client)
  # ---------------------------------------------------------------------------
  flask-app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: flask-app
    ports:
      - "5000:5000"
    networks:
      - monitoring-net
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 2. Prometheus Monitoring Server
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    networks:
      - monitoring-net
    depends_on:
      - flask-app
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 3. Grafana Analytics & Visualization
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      # Secure admin credentials loaded from .env (secrets not hardcoded in compose)
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      # Require real authentication (disable anonymous login)
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SECURITY_ALLOW_EMBEDDING=true
      # Open the provisioned dashboard as the default home dashboard
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/flask-monitoring.json
    volumes:
      # Datasource provisioning
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      # Dashboard provider configuration
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      # Dashboard JSON file definitions
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - monitoring-net
    depends_on:
      - prometheus
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 4. Traffic Generator (Simulates active user requests)
  # ---------------------------------------------------------------------------
  traffic-generator:
    build:
      context: ./traffic-generator
      dockerfile: Dockerfile
    container_name: traffic-generator
    environment:
      - TARGET_URL=http://flask-app:5000/
      - REQUEST_INTERVAL=0.3
    networks:
      - monitoring-net
    depends_on:
      - flask-app
    restart: unless-stopped

# -----------------------------------------------------------------------------
# Common Bridge Network for inter-container DNS and communication
# -----------------------------------------------------------------------------
networks:
  monitoring-net:
    driver: bridge
